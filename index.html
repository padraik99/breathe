<body data-cat="sleep">
<style>
  :root{
    --bg0:#171029; --bg1:#080510; --acc:#e0a86a; --acc2:#a97fd6; --tint:.42;
    --tx:#f6efe7;
    --tx2:rgba(246,239,231,.66);
    --tx3:rgba(246,239,231,.40);
    --edge:rgba(255,224,190,.17);
    --surf:rgba(255,240,220,.05);
    --safe-t:env(safe-area-inset-top,0px);
    --safe-b:env(safe-area-inset-bottom,0px);
  }
  body[data-cat="sleep"] {--bg0:#1c1333;--bg1:#080510;--acc:#e0a86a;--acc2:#a97fd6;--tint:.46;}
  body[data-cat="stress"]{--bg0:#251829;--bg1:#0a0610;--acc:#e8926f;--acc2:#d17fa6;--tint:.30;}
  body[data-cat="focus"] {--bg0:#16212f;--bg1:#060a10;--acc:#f2c14e;--acc2:#5fc7c0;--tint:.06;}
  body[data-cat="dive"]  {--bg0:#0f2231;--bg1:#04090f;--acc:#7fd8d0;--acc2:#e8a85c;--tint:0;}
  body[data-cat="all"]   {--bg0:#1f1730;--bg1:#090610;--acc:#e6b07a;--acc2:#a98fd0;--tint:.30;}

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;}
  body{
    color:var(--tx);
    background:linear-gradient(172deg,var(--bg0) 0%,var(--bg1) 82%);
    transition:background 1.1s ease;
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
  }
  /* the companion sits in its own stacking context so the warmth layer can
     recolour it without touching the interface above */
  #stage{position:fixed;inset:0;isolation:isolate;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;}
  #scrim{position:fixed;inset:0;pointer-events:none;transition:opacity 1s ease;
    background:linear-gradient(180deg,
      color-mix(in srgb,var(--bg1) 52%,transparent) 0%,
      color-mix(in srgb,var(--bg1) 34%,transparent) 42%,
      color-mix(in srgb,var(--bg1) 16%,transparent) 68%,
      color-mix(in srgb,var(--bg1) 54%,transparent) 100%);}
  #scrim.clear{opacity:0;}
  #vign{position:fixed;inset:0;pointer-events:none;
    background:radial-gradient(125% 92% at 50% 44%,transparent 48%,rgba(2,1,5,.30) 100%);}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;
    padding:calc(var(--safe-t) + 16px) 20px calc(var(--safe-b) + 26px);
    transition:opacity .7s ease;}
  .screen.hide{opacity:0;pointer-events:none;}

  /* ---------- top bar ---------- */
  .bar{display:flex;justify-content:space-between;align-items:center;flex:0 0 auto;}
  .mark{font-size:12.5px;font-weight:700;letter-spacing:.26em;color:var(--tx2);}
  .cog{width:36px;height:36px;border-radius:50%;border:1px solid var(--edge);
    display:grid;place-items:center;font-size:16px;color:var(--tx2);cursor:pointer;
    background:var(--surf);}
  .cog:active{background:rgba(255,240,220,.12);}

  /* ---------- category chips ---------- */
  .chips{display:flex;gap:5px;margin-top:16px;flex:0 0 auto;}
  .chips div{flex:1;text-align:center;padding:10px 0;border-radius:11px;font-size:10px;
    font-weight:700;letter-spacing:.09em;color:var(--tx3);border:1px solid transparent;
    cursor:pointer;transition:color .3s,background .3s,border-color .3s;}
  .chips div.on{background:color-mix(in srgb,var(--acc) 17%,transparent);
    border-color:color-mix(in srgb,var(--acc) 45%,transparent);color:var(--tx);}

  /* ---------- the dial ---------- */
  #dialWrap{flex:1 1 auto;display:grid;place-items:center;min-height:0;position:relative;}
  #dialWrap > #dial{grid-area:1/1;} #dialWrap > #listView{grid-area:1/1;width:100%;height:100%;}
  #dial{position:relative;touch-action:none;}
  #dots{transition:transform .38s cubic-bezier(.22,.9,.3,1);transform-origin:175px 175px;}
  #dialFace{position:absolute;inset:0;display:flex;flex-direction:column;
    align-items:center;justify-content:center;text-align:center;padding:0 64px;
    pointer-events:none;}
  #dialFace .eye{font-size:9.5px;font-weight:700;letter-spacing:.2em;color:var(--acc);
    text-transform:uppercase;}
  #dialFace .nm{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-top:9px;
    line-height:1.08;}
  #dialFace .rh{margin-top:8px;font-size:12px;color:var(--tx2);line-height:1.4;}
  #dialFace .gl{width:118px;margin-top:12px;}
  #dialFace .more{margin-top:8px;font-size:9px;letter-spacing:.18em;color:var(--tx3);}
  /* the selected protocol breathes at six a minute, so the live one is obvious
     without needing a different colour from its neighbours */
  .halo{transform-box:fill-box;transform-origin:center;
    animation:halo 10s ease-in-out infinite;}
  @keyframes halo{0%,100%{transform:scale(1);opacity:.34}
                  50%{transform:scale(2.1);opacity:.04}}
  .hit{fill:transparent;cursor:pointer;}
  #shapeStrip{flex:0 0 auto;height:46px;margin-top:2px;opacity:0;
    transition:opacity .55s ease;pointer-events:none;}
  #shapeStrip.on{opacity:1;}
  #dialFace .wl{margin-top:9px;font-size:9px;font-weight:700;letter-spacing:.2em;
    color:var(--tx3);text-transform:uppercase;}
  #tapWhy{position:absolute;left:50%;top:50%;width:210px;height:210px;margin:-105px 0 0 -105px;
    border-radius:50%;cursor:pointer;}

  /* ---------- list fallback for ALL ---------- */
  #listView{overflow-y:auto;-webkit-overflow-scrolling:touch;
    padding:4px 2px 8px;
    mask-image:linear-gradient(180deg,transparent 0,#000 14px,#000 calc(100% - 18px),transparent 100%);}
  .lrow{padding:13px 14px;border-radius:15px;border:1px solid transparent;cursor:pointer;
    display:flex;align-items:center;gap:12px;}
  .lrow.on{border-color:color-mix(in srgb,var(--acc) 40%,transparent);
    background:color-mix(in srgb,var(--acc) 10%,transparent);}
  .lrow .t{flex:1;min-width:0}
  .lrow .n{font-size:19px;font-weight:600;letter-spacing:-.01em;}
  .lrow .r{margin-top:3px;font-size:11px;color:var(--tx3);
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .lrow .c{font-size:8.5px;font-weight:700;letter-spacing:.14em;color:var(--acc);opacity:.85}
  .lrow .g{flex:0 0 74px;width:74px;}
  .lrow .n{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

  /* ---------- minutes ---------- */
  .mins{display:flex;align-items:center;gap:9px;justify-content:center;
    margin-top:10px;flex:0 0 auto;}
  .mins.off{opacity:.38;pointer-events:none;}
  .step{width:38px;height:38px;border-radius:13px;border:1px solid var(--edge);
    display:grid;place-items:center;font-size:19px;color:var(--tx2);background:var(--surf);
    cursor:pointer;}
  .step:active{background:rgba(255,240,220,.14);}
  .field{width:120px;height:40px;border-radius:13px;border:1px solid var(--edge);
    background:var(--surf);display:flex;align-items:center;justify-content:center;gap:5px;}
  .field input{width:44px;background:none;border:0;outline:none;color:var(--tx);
    font:600 20px/1 -apple-system,system-ui;text-align:right;padding:0;
    font-variant-numeric:tabular-nums;-webkit-user-select:text;user-select:text;}
  .field span{font-size:9.5px;letter-spacing:.14em;color:var(--tx3);text-transform:uppercase;}
  .deft{margin-top:8px;text-align:center;font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--tx3);flex:0 0 auto;}

  /* ---------- the line above the button, and the button ---------- */
  .lede2{margin-top:16px;text-align:center;font-size:12px;font-weight:700;
    letter-spacing:.12em;text-transform:uppercase;line-height:1.5;flex:0 0 auto;
    color:color-mix(in srgb,var(--acc) 74%,#ffffff);}
  .go{margin:14px auto 0;width:216px;height:54px;border-radius:17px;border:0;
    position:relative;overflow:hidden;flex:0 0 auto;cursor:pointer;
    font:700 13.5px/1 -apple-system,system-ui;letter-spacing:.22em;color:#1c1206;
    background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 68%,#6d4118));
    box-shadow:0 10px 28px color-mix(in srgb,var(--acc) 26%,transparent);}
  .go .fill{position:absolute;left:0;top:0;bottom:0;width:0;
    background:rgba(255,255,255,.34);pointer-events:none;}
  .go .lbl{position:relative;}
  .stats{display:flex;justify-content:space-between;margin-top:12px;flex:0 0 auto;
    font-size:10.5px;letter-spacing:.1em;color:var(--tx3);
    font-variant-numeric:tabular-nums;}

  /* ---------- session ---------- */
  #intro{position:fixed;left:0;right:0;top:50%;transform:translateY(-50%);
    padding:0 28px;text-align:center;opacity:0;pointer-events:none;transition:opacity .8s ease;}
  #intro.show{opacity:1;}
  #intro .iname{font-size:29px;font-weight:600;letter-spacing:-.02em;}
  #intro .iglyph{margin:20px auto 4px;max-width:330px;}
  #intro .ihint{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--tx3);}
  #intro .icount{margin-top:24px;font:200 58px/1 -apple-system,system-ui;
    color:var(--tx2);font-variant-numeric:tabular-nums;min-height:58px;}
  #ptimer{position:fixed;left:0;right:0;bottom:calc(var(--safe-b) + 76px);text-align:center;
    font:300 40px/1 -apple-system,system-ui;color:rgba(246,239,231,.34);
    font-variant-numeric:tabular-nums;pointer-events:none;opacity:0;transition:opacity .6s;}
  #ptimer.show{opacity:1;}
  #ptimer i{display:block;font-style:normal;font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;color:rgba(246,239,231,.22);margin-top:9px;}
  #sess{justify-content:flex-end;align-items:center;}
  #chrome{opacity:0;transition:opacity .5s;}
  #chrome.show{opacity:1;}
  #stop{font-size:12px;letter-spacing:.24em;text-transform:uppercase;color:var(--tx2);
    padding:14px 26px;cursor:pointer;}
  #prog{position:fixed;left:0;bottom:0;height:2px;width:0;
    background:linear-gradient(90deg,transparent,var(--acc));}

  /* ---------- sheets ---------- */
  #sheetScrim{position:fixed;inset:0;background:rgba(4,2,8,.6);opacity:0;
    pointer-events:none;transition:opacity .35s;z-index:40;}
  #sheetScrim.on{opacity:1;pointer-events:auto;}
  .sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;
    max-height:86vh;display:flex;flex-direction:column;

var A = null, master=null, verb=null, drone=null, droneGain=null, droneFilt=null,
    silentEl=null, noiseBuf=null;

/* A real room swallows treble faster than bass, so the impulse is progressively
   low-passed as it decays. Each channel gets its own noise for a wide tail. */
function makeVerb(ctx){
  var len = Math.floor(ctx.sampleRate*5.5), buf = ctx.createBuffer(2,len,ctx.sampleRate);
  for(var c=0;c<2;c++){
    var d = buf.getChannelData(c), lp=0;
    for(var i=0;i<len;i++){
      var t = i/len;
      var damp = 0.35 - 0.30*t;                    // treble dies away with time
      lp += (Math.random()*2-1 - lp) * Math.max(0.02, damp);
      d[i] = lp * Math.pow(1-t, 2.1) * (i < ctx.sampleRate*0.018 ? 0.22 : 1) * 2.4;
    }
  }
  var cv = ctx.createConvolver(); cv.buffer = buf; return cv;
}

function makeNoise(ctx){
  var len = Math.floor(ctx.sampleRate*2), buf = ctx.createBuffer(1,len,ctx.sampleRate);
  var d = buf.getChannelData(0), last=0;
  for(var i=0;i<len;i++){ last = (last + (Math.random()*2-1)*0.32)/1.32; d[i]=last*2.2; }
  return buf;
}

function initAudio(){
  if(A) { if(A.state==='suspended') A.resume(); return; }
  var C = window.AudioContext||window.webkitAudioContext;
  if(!C) return;
  /* ask for 48 kHz; devices that will not give it fall back to their own rate */
  try{ A = new C({sampleRate:48000, latencyHint:'playback'}); }catch(e){ A = new C(); }
  try{ if(navigator.audioSession) navigator.audioSession.type='playback'; }catch(e){}
  /* a gentle limiter so overlapping rings never clip into fizz */
  var lim = A.createDynamicsCompressor();
  lim.threshold.value=-6; lim.knee.value=14; lim.ratio.value=4;
  lim.attack.value=0.006; lim.release.value=0.30;
  lim.connect(A.destination);
  master = A.createGain(); master.gain.value = store.vol; master.connect(lim);
  verb = makeVerb(A);
  noiseBuf = makeNoise(A);
  var vg = A.createGain(); vg.gain.value = .60; verb.connect(vg); vg.connect(master);
  A.verbIn = verb;
  if(A.state==='suspended') A.resume();
}

/* Struck metal is inharmonic: its overtones are not whole multiples of the

   so each partial is really two very close frequencies beating against each

var TONE = {
  bowls: { p:[1, 2.74, 5.36, 8.70, 12.50],  g:[1, .34, .17, .075, .028],
           d:[1, .70, .50, .34, .22],       b:[0.55, 1.1, 1.7, 2.4, 3.2], at:0.20 },
  glass: { p:[1, 2.005, 3.99, 6.02, 9.10],  g:[1, .22, .085, .035, .012],
           d:[1, .82, .62, .44, .30],       b:[0.35, 0.7, 1.0, 1.4, 1.9], at:0.11 },
  /* a handpan is deliberately tuned so its first two overtones land on the
     octave and the twelfth — harmonic, not inharmonic. That is what separates
     it from a bell: warm and pitched rather than shimmering and ambiguous. */
  handpan:{ p:[1, 2.00, 3.00, 4.02, 6.01],  g:[1, .44, .24, .10, .035],
            d:[1, .60, .43, .29, .19],      b:[0.4, 0.8, 1.2, 1.7, 2.3],
            at:0.045, tap:0.30 }

function bowl(freq, amp, decay, attack){
  if(!A || store.timbre==='none') return;
  var T = TONE[store.timbre] || TONE.bowls;
  var t = A.currentTime;
  var at = attack===undefined ? T.at : attack;
  var out = A.createGain(); out.gain.value = amp;
  out.connect(master); out.connect(A.verbIn);
  /* a hair of detune per strike so no two rings are identical */
  var drift = 1 + (Math.random()-0.5)*0.0007;
  /* the soft thump of the shell being touched — definition without a clack */
  if(T.tap && noiseBuf){
    var ns=A.createBufferSource(); ns.buffer=noiseBuf; ns.loop=true;
    var nf=A.createBiquadFilter(); nf.type='bandpass';
    nf.frequency.value=freq*2.2; nf.Q.value=1.1;
    var ng=A.createGain();
    ng.gain.setValueAtTime(0.0001,t);
    ng.gain.exponentialRampToValueAtTime(T.tap*amp, t+0.012);
    ng.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
    ns.connect(nf); nf.connect(ng); ng.connect(out);
    ns.start(t); ns.stop(t+0.30);
  }
  for(var i=0;i<T.p.length;i++){
    var f = freq*T.p[i]*drift;
    if(f > 16000) continue;
    var dec = Math.max(0.4, decay*T.d[i]);
    for(var v=0; v<2; v++){
      var o = A.createOscillator(); o.type='sine';
      o.frequency.value = f + (v? 1:-1)*(T.b[i]/2);
      var g = A.createGain();
      g.gain.setValueAtTime(0.0001,t);
      g.gain.exponentialRampToValueAtTime(T.g[i]*0.5, t+at+i*0.025);
      g.gain.exponentialRampToValueAtTime(0.0001, t+dec);
      o.connect(g); g.connect(out);
      o.start(t); o.stop(t + dec + .25);
    }

}

var CUE = {

  'in2':     [293.66, 0.20, 3.5],   // D4
  'hold':    [329.63, 0.13, 4.5],   // E4
  'out':     [146.83, 0.30, 9.0],   // D3, the longest ring

  var c = CUE[type]; if(!c) return;
  var amp = c[1], ring = Math.min(c[2], dur + 3.0);

  var bp=A.createBiquadFilter(); bp.type='bandpass'; bp.Q.value=1.4;
  bp.frequency.value = freq*2.4;

  gp.gain.exponentialRampToValueAtTime(0.0001, t+dur+1.4);

  var vg=A.createGain(); vg.gain.value=0.42; gp.connect(vg); vg.connect(A.verbIn);

/* a short breath of air for the sharp exhales */

  gp.gain.setValueAtTime(0.0001,t);

  gp.gain.exponentialRampToValueAtTime(0.0001, t+dur*0.95);

  var vg=A.createGain(); vg.gain.value=0.28; gp.connect(vg); vg.connect(A.verbIn);

/* metronome: a soft muted pluck on the second, well under the tone */

  var o=A.createOscillator(); o.type='sine'; o.frequency.value=155.6;
  var lp=A.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=760; lp.Q.value=0.7;

  g2.gain.exponentialRampToValueAtTime(0.0001, t+0.50);

function startDrone(){

    var src=A.createBufferSource(); src.buffer=noiseBuf; src.loop=true;
    src.connect(droneFilt); src.start(); drone.push(src);
    var hs=A.createBiquadFilter(); hs.type='highpass'; hs.frequency.value=2600;
    var hg=A.createGain(); hg.gain.value=.35;

    droneFilt.frequency.value = 980; droneFilt.Q.value=.8;

      var lo=A.createOscillator(); lo.type='sine'; lo.frequency.value=lfo[j];

    var ah=A.createBiquadFilter(); ah.type='highpass'; ah.frequency.value=2200;

  droneFilt.frequency.value = 460; droneFilt.Q.value=.7;
  var fs = [73.42, 110.0, 146.83, 220.0, 293.66],
      gs = [.62, .44, .30, .13, .05],
      dt = [0, 4, -3, 6, -5];

    var o = A.createOscillator(); o.type = i<2?'sine':'triangle';
    o.frequency.value = fs[i]; o.detune.value = dt[i];
    var g = A.createGain(); g.gain.value = gs[i];
    o.connect(g); g.connect(droneFilt); o.start();
    drone.push(o);
    /* a second voice a few cents off, drifting — this is what makes it breathe */

      o2.frequency.value = fs[i]; o2.detune.value = dt[i] + (i%2?7:-7);

    droneGain.gain.setTargetAtTime(.095 + v*.055, A.currentTime, .35);

/* ================= THE SHAPE OF A PATTERN =================
   One glance at the rhythm: the line climbs while you breathe in, holds level
   while you hold, falls while you breathe out. Segment widths are true to time,
   so a 40-second hold really does look like a 40-second hold. */
function glyph(p, w, h, big){
  var ph = p.preview || repeatFor(p.phases, 24);
  var total=0, i;
  for(i=0;i<ph.length;i++) total += ph[i].s;
  if(!total) return '';
  var padX=2, labelH = big?17:14, top=big?9:6, H=h-top-labelH-4, W=w-padX*2;
  var x=padX, lung=0, pts='', labels='', ticks='';
  pts += (padX)+','+(top+H)+' ';
  for(i=0;i<ph.length;i++){
    var q=ph[i];
    var to = (q.to===undefined) ? lung : q.to;
    var x2 = x + (q.s/total)*W;
    pts += x2.toFixed(1)+','+(top+H*(1-to)).toFixed(1)+' ';
    var wSeg = x2-x;
    if(wSeg > (big?15:11)){
      var lbl = (q.s % 1 ? q.s.toFixed(1) : q.s);
      labels += '<text x="'+((x+x2)/2).toFixed(1)+'" y="'+(top+H+labelH-3)+
        '" text-anchor="middle" font-size="'+(big?12:10)+'" fill="'+
        (q.t==='hold'||q.t==='holdout' ? 'rgba(127,227,212,.80)' : 'rgba(232,238,245,.60)')+
        '" font-family="ui-serif,Georgia,serif">'+lbl+'</text>';
    }
    if(q.t==='hold'||q.t==='holdout'){
      ticks += '<line x1="'+x.toFixed(1)+'" y1="'+(top+H*(1-to)).toFixed(1)+
        '" x2="'+x2.toFixed(1)+'" y2="'+(top+H*(1-to)).toFixed(1)+
        '" stroke="rgba(127,227,212,.85)" stroke-width="'+(big?3:2.2)+'" stroke-linecap="round"/>';
    }
    lung=to; x=x2;
  }
  return '<svg class="glyph" viewBox="0 0 '+w+' '+h+'" width="100%" height="'+h+'" '+
    'preserveAspectRatio="none" aria-hidden="true">'+
    '<line x1="0" y1="'+(top+H)+'" x2="'+w+'" y2="'+(top+H)+
      '" stroke="rgba(232,238,245,.10)" stroke-width="1"/>'+
    '<polyline points="'+pts+'" fill="none" stroke="rgba(232,238,245,.55)" '+
      'stroke-width="'+(big?2.2:1.7)+'" stroke-linejoin="round" stroke-linecap="round"/>'+
    ticks + labels + '</svg>';
}
/* enough whole cycles to read as a rhythm, without overflowing the strip */
function repeatFor(phases, secs){
  var one=0, i; for(i=0;i<phases.length;i++) one += phases[i].s;
  var out=[], n = one ? Math.max(1, Math.min(3, Math.floor(secs/one))) : 1;
  for(i=0;i<n;i++) out = out.concat(phases);
  return out;
}

var cv = document.getElementById('cv'), g = cv.getContext('2d');
var W=0,H=0,DPR=1;
function resize(){

function n1(x){ var i=Math.floor(x), f=x-i, a=NS[((i%512)+512)%512], b=NS[(((i+1)%512)+512)%512];
  var u=f*f*(3-2*f); return a+(b-a)*u; }

var VIS = {};

/* layout: lerps between "resting behind the menu" and "centre stage" */

function soft(x,y,rx,ry,c,al,mid){
  if(!(rx>0&&ry>0)) return;
  g.save(); g.translate(x,y); g.scale(1, ry/rx);
  var rg=g.createRadialGradient(0,0,0,0,0,rx);
  rg.addColorStop(0,   'rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')');
  rg.addColorStop(mid, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*0.42).toFixed(3)+')');
  rg.addColorStop(1,   'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,rx,0,6.283); g.fill();
  g.restore();
}
/* near-flat core with a soft rim — unions of these read as one lumpy mass */
function disc(x,y,rx,ry,c,al){
  if(!(rx>0&&ry>0)) return;
  g.save(); g.translate(x,y); g.scale(1, ry/rx);
  var rg=g.createRadialGradient(0,0,0,0,0,rx);
  rg.addColorStop(0,    'rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')');
  rg.addColorStop(0.58, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*0.92).toFixed(3)+')');
  rg.addColorStop(0.80, 'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*0.52).toFixed(3)+')');
  rg.addColorStop(1,    'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
  g.fillStyle=rg; g.beginPath(); g.arc(0,0,rx,0,6.283); g.fill();
  g.restore();
}

VIS.ink = function(t,v){

  var R = base*(0.60 + v*0.95);
  var COL=[[118,204,255],[146,255,226],[190,166,255],[104,238,206],[255,186,228]];
  /* each layer: an irregular silhouette, feathered by concentric strokes */
  for(var layer=0; layer<4; layer++){
    var c=COL[layer], seed=layer*17.3;
    var spin = t*(0.050 + layer*0.028)*(layer%2?-1:1);
    var Rl = R*(0.70 + layer*0.26);
    g.beginPath();
    for(var a=0;a<=6.2832;a+=0.03){
      var wob = 1
        + 0.26*(n1(a*1.5 + seed + t*0.20)-0.5)
        + 0.17*(n1(a*3.2 + seed - t*0.15)-0.5)
        + 0.09*(n1(a*6.4 + seed + t*0.10)-0.5);
      var rr = Rl*wob;
      var xx = cx + Math.cos(a+spin)*rr, yy = cy + Math.sin(a+spin)*rr*0.93;
      a===0?g.moveTo(xx,yy):g.lineTo(xx,yy);
    }
    g.closePath();
    /* gradient dies out well inside the silhouette, so the outline never shows */
    var al=(0.075+v*0.075)*(1-layer*0.12);
    var rg=g.createRadialGradient(cx,cy,Rl*0.02,cx,cy,Rl*1.30);
    rg.addColorStop(0,   'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*1.35).toFixed(3)+')');
    rg.addColorStop(0.34,'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*0.80).toFixed(3)+')');
    rg.addColorStop(0.64,'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*0.26).toFixed(3)+')');
    rg.addColorStop(0.86,'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*0.05).toFixed(3)+')');
    rg.addColorStop(1,   'rgba('+c[0]+','+c[1]+','+c[2]+',0)');
    g.fillStyle=rg; g.fill();
  }
  soft(cx, cy, R*0.80, R*0.74, [214,246,255], 0.075+v*0.070, 0.28);
  soft(cx, cy, R*2.2, R*2.0, [130,208,255], 0.016+v*0.022, 0.40);
  g.globalCompositeOperation='source-over';
};

/* -- 4. bloom -- */

VIS.bloom = function(t,v){
  var cx=W/2, cy=H*LY, base=Math.min(W,H)*0.20*LS;
  g.globalCompositeOperation='lighter';
  var RINGS=[{n:7,sp:0.030,ph:0,   len:1.45,wid:0.30,col:[255,214,168],al:1.00},
             {n:5,sp:-0.021,ph:0.62,len:1.02,wid:0.26,col:[255,178,190],al:0.72},
             {n:4,sp:0.014,ph:1.25,len:0.66,wid:0.22,col:[255,240,205],al:0.55}];
  var open = 0.08 + v*0.92;
  for(var ri=0; ri<RINGS.length; ri++){
    var Rg=RINGS[ri];
    for(var k=0;k<Rg.n;k++){
      var a = (k/Rg.n)*6.2832 + t*Rg.sp + Rg.ph;
      var wob = Math.sin(t*0.55 + k*1.31 + ri)*0.055;
      var L = base*Rg.len*(0.30 + open*0.92);
      var Wd = base*Rg.wid*(0.55 + open*0.55);
      var ax=Math.cos(a+wob), ay=Math.sin(a+wob);
      var px=-ay, py=ax;                       // perpendicular
      var ex=cx+ax*L, ey=cy+ay*L;
      g.beginPath(); g.moveTo(cx,cy);
      g.bezierCurveTo(cx+ax*L*0.30+px*Wd, cy+ay*L*0.30+py*Wd,
                      cx+ax*L*0.78+px*Wd*0.55, cy+ay*L*0.78+py*Wd*0.55, ex,ey);
      g.bezierCurveTo(cx+ax*L*0.78-px*Wd*0.55, cy+ay*L*0.78-py*Wd*0.55,
                      cx+ax*L*0.30-px*Wd, cy+ay*L*0.30-py*Wd, cx,cy);
      g.closePath();
      var lg=g.createLinearGradient(cx,cy,ex,ey);
      var al=(0.085+v*0.075)*Rg.al;
      var c=Rg.col;
      lg.addColorStop(0,  'rgba('+c[0]+','+c[1]+','+c[2]+','+(al*1.7).toFixed(3)+')');
      lg.addColorStop(.5, 'rgba('+c[0]+','+c[1]+','+c[2]+','+al.toFixed(3)+')');
      lg.addColorStop(1,  'rgba(232,132,176,0)');
      g.fillStyle=lg; g.fill();
    }
  }
  var cr = base*(0.30+v*0.34)*(1+0.05*Math.sin(t*1.4));
  var rg=g.createRadialGradient(cx,cy,0,cx,cy,cr*2.6);
  rg.addColorStop(0,  'rgba(255,248,224,'+(0.30+v*0.20).toFixed(3)+')');
  rg.addColorStop(.28,'rgba(255,206,152,'+(0.16+v*0.12).toFixed(3)+')');
  rg.addColorStop(.65,'rgba(255,160,140,'+(0.05+v*0.05).toFixed(3)+')');
  rg.addColorStop(1,  'rgba(255,150,120,0)');
  g.fillStyle=rg; g.beginPath(); g.arc(cx,cy,cr*2.6,0,6.283); g.fill();
  g.globalCompositeOperation='source-over';
};

var TIMBRES = [
  {id:'bowls',   n:'Bowls',   d:'warm, long ring'},
  {id:'glass',   n:'Glass',   d:'clear and bright'},
  {id:'handpan', n:'Handpan', d:'round and pitched'},
  {id:'breath',  n:'Breath',  d:'a swell of air'},
  {id:'none',    n:'None',    d:'no phase tone'}
];

var BEDS = [
  {id:'drone',  n:'Thrum',  d:'low sustained bed'},
  {id:'shruti', n:'Shruti', d:'reed harmonium'},
  {id:'rain',   n:'Rain',   d:'soft rainfall'},
  {id:'off',    n:'No bed', d:'tones only'}
];


/* -- 1. bioluminescent drifter --------------------------------------------
   The old tentacles were a fixed vertical drop with a sine laid over them:
   the feet moved and the body didn't. These are simulated instead — each
   tentacle is a chain of points with inertia and drag, pulled along by the
   bell and constrained to its neighbours. The tail lags, curls and overshoots
   because it is actually being dragged through water, not drawn waving.      */
var jparts=[]; for(var i=0;i<90;i++) jparts.push({x:Math.random(),y:Math.random(),
  s:.4+Math.random()*1.6, v:.004+Math.random()*.014, p:Math.random()*6.28});

var JF = {ready:false, tent:[], arms:[], v:0, prev:0, vel:0, t:0, cx:0, cy:0, pcx:0, lean:0};

function ropeInit(){
  JF.tent=[];
  for(var k=0;k<15;k++){
    var pts=[]; for(var s=0;s<=20;s++) pts.push({x:0,y:0,px:0,py:0});
    JF.tent.push({pts:pts, off:(k/14)-0.5, seed:k*3.77,
                  hang:0.55+0.75*n1(k*3.7+1.3), thin:(k%3===0)?1.9:1.15,
                  bias:((k/14)-0.5)*2});
  }
  JF.arms=[];
  for(var q=0;q<4;q++){
    var p2=[]; for(var s2=0;s2<=13;s2++) p2.push({x:0,y:0,px:0,py:0});
    JF.arms.push({pts:p2, off:(q/3-0.5), seed:q*5.13});
  }
  JF.ready=false;
}

/* verlet: position carries its own velocity, so a constraint that moves a
   point also gives it momentum — which is exactly the trailing we want */
function ropeStep(rope, ax, ay, seg, dt, drag, grav, cur, t){
  var p=rope.pts, n=p.length, i;
  if(!JF.ready){
    for(i=0;i<n;i++){ p[i].x=ax; p[i].y=ay+seg*i; p[i].px=p[i].x; p[i].py=p[i].y; }
    return;
  }
  var d2 = dt*dt;
  for(i=1;i<n;i++){
    var q=p[i];
    var f = i/n;
    /* the flow has to vary along the rope, not just over time — a single
       lateral force only ever produces a straight rope leaning over */
    var flow = ((n1(t*0.50 + i*0.45 + rope.seed) - 0.5) * 1.0 +
                (n1(t*0.21 + i*0.17 + rope.seed*1.7) - 0.5) * 0.7)
               * cur * (0.28 + f*1.15) + (rope.bias||0) * 52 * f;
    var nx = q.x + (q.x-q.px)*drag + flow*d2;
    var ny = q.y + (q.y-q.py)*drag + grav*d2;
    q.px=q.x; q.py=q.y; q.x=nx; q.y=ny;
  }
  p[0].x=ax; p[0].y=ay; p[0].px=ax; p[0].py=ay;
  for(var pass=0; pass<3; pass++){
    for(i=1;i<n;i++){
      var a=p[i-1], b=p[i];
      var dx=b.x-a.x, dy=b.y-a.y;
      var d=Math.sqrt(dx*dx+dy*dy) || 0.0001;
      var k=(d-seg)/d*0.5;
      if(i>1){ a.x+=dx*k; a.y+=dy*k; }
      b.x-=dx*k; b.y-=dy*k;
    }
    p[0].x=ax; p[0].y=ay;
  }
}

function curveThrough(pts){
  g.beginPath(); g.moveTo(pts[0].x, pts[0].y);
  for(var i=1;i<pts.length-1;i++){
    var mx=(pts[i].x+pts[i+1].x)/2, my=(pts[i].y+pts[i+1].y)/2;
    g.quadraticCurveTo(pts[i].x, pts[i].y, mx, my);
  }
  var L=pts.length-1;
  g.lineTo(pts[L].x, pts[L].y);
}

VIS.jelly = function(t,v){
  var dt = Math.min(0.042, Math.max(0.004, t-JF.t)); JF.t=t;
  JF.v += (v - JF.v) * Math.min(1, dt*4.2);
  JF.vel = (JF.v - JF.prev)/dt; JF.prev = JF.v;
  var vel = Math.max(-1.6, Math.min(1.6, JF.vel));
  if(!JF.tent.length) ropeInit();

  var base = Math.min(W,H)*0.20*LS;
  var cx = W/2 + Math.sin(t*0.113)*Math.min(W,H)*0.06 + Math.sin(t*0.31)*7;
  var R = base*(0.74 + JF.v*0.58);
  /* contracting drives it forward and lets it glide back on the refill —
     that jet is most of what makes a jellyfish read as alive */
  var cy = H*LY + Math.sin(t*0.181)*H*0.02 - JF.v*Math.min(W,H)*0.022 + vel*R*0.34;
  /* squash and stretch: narrow and long on the squeeze, wide and shallow
     as it fills. The old multipliers were both a tenth, and backwards. */
  var idle = 0.055*Math.sin(t*1.05);          // never completely still
  var rx = R*1.12*(1 + vel*0.42 - idle);
  var ry = R*(0.90 + JF.v*0.14)*(1 - vel*0.34 + idle);
  var lip = cy + ry*0.34;
  /* lean into the drift, and carry the tentacle roots round with it */
  var vx = (cx - (JF.pcx||cx))/dt; JF.pcx = cx;
  JF.lean += (Math.max(-0.24, Math.min(0.24, -vx*0.0016)) - JF.lean)*Math.min(1,dt*2.2);
  var LN=JF.lean, cosL=Math.cos(LN), sinL=Math.sin(LN);
  function rot(x,y){
    var dx=x-cx, dy=y-cy;
    return [cx+dx*cosL-dy*sinL, cy+dx*sinL+dy*cosL];
  }

  g.globalCompositeOperation='lighter';

  for(var i=0;i<jparts.length;i++){
    var p=jparts[i]; p.y-=p.v*0.55; if(p.y<-.05)p.y=1.05;
    var px=(p.x*W + Math.sin(t*.3+p.p)*18), py=p.y*H;
    var a=(0.07+0.06*Math.sin(t*.9+p.p))*(0.45+JF.v*0.75);
    g.fillStyle='rgba(150,238,228,'+Math.max(0,a).toFixed(3)+')';
    g.beginPath(); g.arc(px,py,p.s*(1+JF.v*.5),0,6.283); g.fill();
  }

  /* tentacles */
  g.lineCap='round'; g.lineJoin='round';
  for(var k=0;k<JF.tent.length;k++){
    var rope=JF.tent[k];
    var A0 = rot(cx + rope.off*rx*1.70, lip - Math.abs(rope.off)*ry*0.28);
    var ax = A0[0], ay = A0[1];
    var seg = R*(0.135 + 0.050*rope.hang);
    /* gravity dominant, current a gentle sway — the other way round is a gale */
    ropeStep(rope, ax, ay, seg, dt, 0.980, 430, 900*(0.6+0.8*rope.hang), t);
    curveThrough(rope.pts);
    g.strokeStyle='rgba(126,222,238,'+(0.11+0.14*JF.v).toFixed(3)+')';
    g.lineWidth = rope.thin; g.stroke();
  }

  /* oral arms — heavier, shorter, drawn as tapered ribbons */
  for(var q=0;q<JF.arms.length;q++){
    var arm=JF.arms[q];
    var A1 = rot(cx + arm.off*rx*0.66, lip - Math.abs(arm.off)*ry*0.16);
    var ax2 = A1[0], ay2 = A1[1];
    ropeStep(arm, ax2, ay2, R*0.125, dt, 0.962, 420, 340, t+40);
    var pts=arm.pts, W2=[];
    for(var w=0;w<pts.length;w++)
      W2.push(R*0.19*(1 - w/pts.length*0.86)*(0.7+0.5*n1(q*3.3+w*0.4)));
    g.beginPath();
    for(var w2=0;w2<pts.length;w2++){
      var nx2=(w2<pts.length-1)?pts[w2+1].x-pts[w2].x:pts[w2].x-pts[w2-1].x;
      var ny2=(w2<pts.length-1)?pts[w2+1].y-pts[w2].y:pts[w2].y-pts[w2-1].y;
      var L2=Math.sqrt(nx2*nx2+ny2*ny2)||1;
      pts[w2].nx=-ny2/L2; pts[w2].ny=nx2/L2;
      var x1=pts[w2].x+pts[w2].nx*W2[w2], y1=pts[w2].y+pts[w2].ny*W2[w2];
      w2===0?g.moveTo(x1,y1):g.lineTo(x1,y1);
    }
    for(var w3=pts.length-1;w3>=0;w3--)
      g.lineTo(pts[w3].x-pts[w3].nx*W2[w3], pts[w3].y-pts[w3].ny*W2[w3]);
    g.closePath();
    var ag=g.createLinearGradient(cx,lip,cx,lip+R*2.0);
    ag.addColorStop(0,'rgba(168,238,246,'+(0.070+0.065*JF.v).toFixed(3)+')');
    ag.addColorStop(1,'rgba(110,190,238,0)');
    g.fillStyle=ag; g.fill();
  }
  JF.ready = true;

  /* bell */
  var curl = ry*(0.17 + vel*0.42);   // the margin folds under as it contracts
  function bellPath(){
    var L=cy+ry*0.34, p;
    g.beginPath();
    p=rot(cx-rx, L); g.moveTo(p[0],p[1]);
    var c1=rot(cx-rx*1.06, cy-ry*1.16), c2=rot(cx+rx*1.06, cy-ry*1.16), e=rot(cx+rx, L);
    g.bezierCurveTo(c1[0],c1[1],c2[0],c2[1],e[0],e[1]);
    for(var i2=6;i2>=0;i2--){
      var q=rot(cx-rx + (rx*2)*((i2+0.5)/7), L + curl*(1+0.28*Math.sin(t*1.4+i2)));
      var r2=rot(cx-rx + (rx*2)*(i2/7), L);
      g.quadraticCurveTo(q[0],q[1],r2[0],r2[1]);
    }
    g.closePath();
  }
  var gr=g.createRadialGradient(cx, cy-ry*0.30, R*0.04, cx, cy, R*1.75);
  gr.addColorStop(0,   'rgba(196,252,246,'+(0.44+JF.v*0.22).toFixed(3)+')');
  gr.addColorStop(0.22,'rgba(112,228,224,'+(0.34+JF.v*0.24).toFixed(3)+')');
  gr.addColorStop(0.55,'rgba(84,152,240,' +(0.17+JF.v*0.14).toFixed(3)+')');
  gr.addColorStop(1,   'rgba(58,72,190,0)');
  g.fillStyle=gr; bellPath(); g.fill();

  g.save(); bellPath(); g.clip();
  for(var q2=0;q2<5;q2++){
    var xo=cx+(q2-2)*rx*0.30;
    g.beginPath(); g.moveTo(cx+(q2-2)*rx*0.10, cy-ry*0.80);
    g.quadraticCurveTo(xo*0.5+cx*0.5, cy-ry*0.15, xo, cy+ry*0.30);
    g.strokeStyle='rgba(200,255,250,'+(0.035+0.035*JF.v).toFixed(3)+')';
    g.lineWidth=3.0; g.stroke();
  }
  var cg=g.createRadialGradient(cx,cy-ry*0.10,0,cx,cy-ry*0.10,R*0.78);
  cg.addColorStop(0,  'rgba(236,255,252,'+(0.16+JF.v*0.14).toFixed(3)+')');
  cg.addColorStop(0.4,'rgba(150,246,238,'+(0.09+JF.v*0.09).toFixed(3)+')');
  cg.addColorStop(1,  'rgba(150,246,238,0)');
  g.fillStyle=cg; g.fillRect(cx-rx,cy-ry*1.2,rx*2,ry*2.4);
  g.restore();

  var hr = R*(1.5 + JF.v*1.5);
  var hg=g.createRadialGradient(cx,cy,hr*0.55,cx,cy,hr);
  hg.addColorStop(0,'rgba(120,230,225,'+(0.030+JF.v*0.045).toFixed(3)+')');
  hg.addColorStop(1,'rgba(120,230,225,0)');
  g.fillStyle=hg; g.beginPath(); g.arc(cx,cy,hr,0,6.283); g.fill();

  g.globalCompositeOperation='source-over';
};

/* -- 2. aurora ------------------------------------------------------------
   Five independent curtains at their own heights, drifting at their own
   speeds, with flares that swell one region and fade. Fills the screen.     */
var stars=[]; for(var i=0;i<170;i++) stars.push({x:Math.random(),y:Math.random(),
  s:Math.random()*1.3+.2, p:Math.random()*6.28});
var AUR=null;
function aurInit(){
  AUR=[];
  var COLS=[[128,246,204],[100,190,248],[178,152,250],[126,240,180],[214,160,236]];
  for(var i=0;i<5;i++){
    AUR.push({
      c:COLS[i],
      y:0.30+Math.random()*0.52,          // where this curtain stands
      vy:(Math.random()-0.5)*0.010,       // and how it wanders
      spd:0.05+Math.random()*0.14,
      ph:Math.random()*40,
      w:0.55+Math.random()*0.75,          // how much of the width it covers
      cx:0.2+Math.random()*0.6,
      h:0.34+Math.random()*0.46,
      flare:0, next:2+Math.random()*14
    });
  }
}
VIS.aurora = function(t,v){
  if(!AUR) aurInit();
  g.globalCompositeOperation='lighter';
  for(var i=0;i<stars.length;i++){
    var s=stars[i], a=0.13+0.16*Math.sin(t*0.7+s.p);
    g.fillStyle='rgba(228,238,255,'+Math.max(0,a).toFixed(3)+')';
    g.fillRect(s.x*W, s.y*H, s.s, s.s);
  }
  var NC=26, reach=Math.min(H*1.05, W*2.0);
  for(var b=0;b<AUR.length;b++){
    var A2=AUR[b];
    A2.y += A2.vy*0.016; if(A2.y<0.24||A2.y>0.86) A2.vy*=-1;
    A2.next -= 0.016;
    if(A2.next<=0){ A2.flare=1; A2.next=6+Math.random()*22; }
    A2.flare *= 0.994;
    var floorY=H*A2.y;
    var hMax=reach*A2.h*(0.30+v*0.52)*(0.55+LS*0.55)*(1+A2.flare*0.85);
    var drift=Math.sin(t*A2.spd + A2.ph)*0.10;
    for(var i2=0;i2<NC;i2++){
      var u=(i2+0.5)/NC;
      var rel=(u - A2.cx)/A2.w;                 // this curtain's own window
      if(rel<-1||rel>1) continue;
      var un=u+drift;
      var edge=Math.pow(Math.cos(rel*Math.PI/2), 0.7);
      var hh = hMax*edge*
        (0.22+0.78*n1(un*3.4 + A2.ph + t*A2.spd*0.9))*
        (0.50+0.50*n1(un*9.1 + A2.ph*2 - t*0.06))*
        (0.66+0.34*n1(un*19.0 + A2.ph*3 + t*0.13));
      if(hh<8) continue;
      var fy=floorY + Math.sin(u*2.6+t*0.20+A2.ph)*24 + Math.sin(u*6.1-t*0.11)*10;
      var al=(0.056+v*0.082)*(0.40+0.60*n1(un*7.7+A2.ph-t*0.17))*(1+A2.flare*1.1);
      soft(u*W + Math.sin(t*0.3+i2)*3, fy - hh*0.46,
           (W/NC)*2.3, hh*0.62, A2.c, al, 0.55);
    }
    soft(W*A2.cx, floorY+4, W*0.5*A2.w, reach*0.024*(0.6+v*0.7),
         A2.c, (0.070+v*0.085)*(1+A2.flare), 0.35);
  }
  g.globalCompositeOperation='source-over';
};

/* ============================ THE PRE-CUE ============================
   A hint of the tone that is coming, one second before it arrives, so nobody
   has to count. Quiet, short, and at the pitch of the phase about to start. */
function preCue(type){
  if(!A || store.timbre==='none') return;
  var c = CUE[type]; if(!c) return;
  if(store.timbre==='breath'){ swell(c[0]*1.5, c[1]*0.10, 0.7); return; }
  bowl(c[0]*2, c[1]*0.085, 1.1, 0.16);
}

/* ============================ ENGINE ============================ */
var running=false, startT=0, targetSec=0, hardCap=0, phaseIdx=0, phaseT=0;
var lungFrom=0, lung=0, lungTo=1, preCued=false, cueGlow=0;
var idlePhase=0, lastFrame=0, wake=null, dbTick=0, starting=false, uiT=0;
var lastTick=-1, lastShown=-1;
var PHASE_NAME = {'in':'breathe in','in2':'top up','hold':'hold',
                  'out':'breathe out','holdout':'empty'};

function easeCos(x){ return 0.5 - 0.5*Math.cos(Math.PI*Math.max(0,Math.min(1,x))); }
function phaseSum(p){ var n=0,i; for(i=0;i<p.phases.length;i++) n+=p.phases[i].s; return n; }

/* Where a session actually ends: run the pattern forward from the requested
   time and stop at the end of the first exhale after it. Never mid-breath. */
function realLength(p, wantSec){
  if(p.once) return Math.round(phaseSum(p));
  var t=0, i=0, guard=0;
  while(guard++ < 20000){
    var ph = p.phases[i % p.phases.length];
    t += ph.s;
    var done = (ph.t==='out' || ph.t==='holdout');
    if(t >= wantSec && done) return Math.round(t);
    i++;
  }
  return wantSec;
}
function fmtClock(s){
  var m=Math.floor(s/60), r=Math.round(s%60);
  return m+':'+(r<10?'0':'')+r;
}

function beginPhase(i){
  var ph = sel.phases[i];
  lungFrom = lung;
  lungTo = (ph.to===undefined) ? lung : ph.to;
  phaseT = 0; preCued = false;
  cue(ph.t, ph.s);
}

function frame(ts){
  requestAnimationFrame(frame);
  var now = ts/1000;
  var dt = lastFrame ? Math.min(now-lastFrame, .1) : .016;
  lastFrame = now;

  if(running){
    phaseT += dt;
    var ph = sel.phases[phaseIdx];
    var pr = Math.min(1, phaseT/ph.s);
    var e = ph.t==='in2' ? (1-Math.pow(1-pr,2.2)) : easeCos(pr);
    lung = lungFrom + (lungTo-lungFrom)*e;

    if(!preCued && ph.s >= 2.2 && phaseT >= ph.s - 1){
      preCued = true; cueGlow = 1;
      var nxt = sel.phases[(phaseIdx+1) % sel.phases.length];
      preCue(nxt.t);
    }

    if(phaseT >= ph.s){
      var el0 = now - startT;
      var closed = (ph.t==='out' || ph.t==='holdout');
      if(sel.once && phaseIdx === sel.phases.length-1){ finish(); return; }
      if(!sel.once && closed && el0 >= targetSec){ finish(); return; }
      phaseIdx = (phaseIdx+1) % sel.phases.length;
      beginPhase(phaseIdx);
    }
    if((dbTick=(dbTick+1)%5)===0) droneBreath(lung);
    var el = now - startT;
    if(el > hardCap){ finish(); return; }
    var sec = Math.floor(el);
    if(sec !== lastTick){ lastTick = sec; if(sec>0) tick(); }
    if(sel.timer){
      var left = Math.max(0, Math.ceil(ph.s - phaseT));
      if(left !== lastShown){
        lastShown = left;
        elTimer.innerHTML = left + '<i>' + PHASE_NAME[ph.t] + '</i>';
      }
    }
    elProg.style.width = Math.min(100, el/targetSec*100)+'%';
  } else {
    idlePhase += dt/10;
    lung = 0.12 + (0.5 - 0.5*Math.cos(idlePhase*Math.PI*2))*0.5;
  }

  cueGlow = Math.max(0, cueGlow - dt*1.15);

  var tgt = (running||starting) ? 1 : 0;
  uiT += (tgt-uiT) * Math.min(1, dt*1.6);
  LY = 0.42 + (0.46-0.42)*uiT;
  LS = 0.50 + (1.00-0.50)*uiT;
  LA = 0.66 + (1.00-0.66)*uiT;

  g.clearRect(0,0,W,H);
  /* the companion belongs to the session; the home screen stays quiet */
  if(!running && !starting){ g.globalAlpha=1; return; }
  g.globalAlpha = LA;
  (VIS[store.vis]||VIS.jelly)(now, lung);
  /* warm the creature toward the category accent — source-atop touches only
     pixels that were actually drawn, so the background is left alone */
  if(TINT.a > 0.01){
    g.globalCompositeOperation='source-atop';
    g.globalAlpha = LA * TINT.a;
    g.fillStyle = TINT.c;
    g.fillRect(0,0,W,H);
    g.globalCompositeOperation='source-over';
    g.globalAlpha = LA;
  }
  /* the visual half of the pre-cue. Barely there when sound is on — the tone
     is already doing the job — and only legible when it has to carry it alone. */
  if(cueGlow > 0.01){
    var rr = Math.min(W,H)*(0.20 + (1-cueGlow)*0.12)*LS*2.0;
    g.globalAlpha = LA * cueGlow * (store.timbre==='none' ? 0.20 : 0.055);
    g.beginPath(); g.arc(W/2, H*LY, rr, 0, 6.283);
    g.strokeStyle='rgba(255,246,235,.9)'; g.lineWidth=1.1; g.stroke();
  }
  g.globalAlpha = 1;
}

  {id:'aurora', n:'Aurora',  vis:'aurora', timbre:'glass',   c:['#8ef0c4','#a97fd6']},

function worldIndex(){

/* Two rings, two jobs. Which one you get is decided by how far from the centre
   your finger lands: the outer band is the length, the inner band is the world. */
(function(){
  var mode=null, lastA=0, acc=0, moved=0;
  function polar(e){
    var r=elDial.getBoundingClientRect();
    var t=(e.touches?e.touches[0]:e);
    var dx=t.clientX-(r.left+r.width/2), dy=t.clientY-(r.top+r.height/2);
    var scale = 350/r.width;                       // svg units, not css pixels
    return {a:Math.atan2(dy,dx)*180/Math.PI, r:Math.sqrt(dx*dx+dy*dy)*scale};
  }
  function down(e){
    if(cat==='all') return;
    var p=polar(e);
    mode = p.r>148 ? 'min' : (p.r>120 ? 'world' : null);
    if(mode==='min' && sel.once) mode=null;
    lastA=p.a; acc=0; moved=0;
  }
  function move(e){
    if(!mode) return;
    var p=polar(e), d=p.a-lastA;
    while(d>180) d-=360; while(d<-180) d+=360;
    lastA=p.a; moved+=Math.abs(d);
    if(moved>7 && e.cancelable) e.preventDefault();
    if(mode==='min'){
      if(moved<5) return;
      var v = Math.round(((p.a+90+360)%360)/6);    // a clock face: one turn, sixty minutes
      if(v<1) v=1; if(v>60) v=60;
      if(v!==mins){ mins=v; setMinutes(cat,mins); elMinInput.value=mins;
                    paintMinutes(); renderMins(); }
    } else {
      acc+=d;
      while(acc >  50){ acc-=50; setWorld(worldIndex()+1); }
      while(acc < -50){ acc+=50; setWorld(worldIndex()-1); }
    }
  }
  function up(){ mode=null; }
  elDial.addEventListener('touchstart',down,{passive:true});
  elDial.addEventListener('touchmove',move,{passive:false});
  elDial.addEventListener('touchend',up,{passive:true});
  elDial.addEventListener('mousedown',down);
  window.addEventListener('mousemove',move);
  window.addEventListener('mouseup',up);
})();

}
function bump(d){
  if(sel.once) return;
  mins = Math.max(1, Math.min(60, mins + d));
  setMinutes(cat, mins); elMinInput.value = mins; renderMins(); paintMinutes();
}
(function(){
  [['minus',-1],['plus',1]].forEach(function(pair){

    function go(){ bump(dir); gap = Math.max(55, gap*0.72); tmr=setTimeout(go, gap); }
    function start(e){ e.preventDefault(); bump(dir); gap=340; tmr=setTimeout(go, 420); }
    function stop(){ clearTimeout(tmr); }
    el.addEventListener('touchstart',start,{passive:false});
    el.addEventListener('touchend',stop); el.addEventListener('touchcancel',stop);
    el.addEventListener('mousedown',start); window.addEventListener('mouseup',stop);
  });
})();

/* ============================ SESSION ============================ */
function requestWake(){
  if('wakeLock' in navigator)
    navigator.wakeLock.request('screen').then(function(w){ wake=w; }).catch(function(){});
}
function releaseWake(){ if(wake){ try{wake.release();}catch(e){} wake=null; } }
document.addEventListener('visibilitychange', function(){
  if(document.visibilityState==='visible' && running) requestWake();
});

function start(){
  if(running || starting) return;
  starting = true;
  initAudio(); unlockSilent();
  closeSheets();
  elHome.classList.add('hide'); elSess.classList.remove('hide');
  document.getElementById('iName').textContent = sel.name;
  document.getElementById('iGlyph').innerHTML = glyph(sel, 330, 92, true);
  document.getElementById('iHint').textContent =
    sel.preview ? 'one round · seconds' : 'seconds per phase';
  elIntro.classList.add('show');
  var n=4;
  (function tk(){
    if(n===0){
      elIntro.classList.remove('show');
      elScrim.classList.add('clear');
      starting=false; running=true;
      targetSec = realLength(sel, mins*60);
      hardCap = targetSec + 120;
      startT = performance.now()/1000;
      lung=0; phaseIdx=0; lastTick=-1; lastShown=-1;
      elProg.style.width='0%';
      elTimer.classList.toggle('show', !!sel.timer);
      startDrone(); beginPhase(0); requestWake();
      return;
    }
    elCount.textContent = n; n--;
    setTimeout(tk, 1000);
  })();
}

function finish(){ endSession(true); }
function endSession(complete){
  if(!running) return;
  running = false;
  var el = performance.now()/1000 - startT;
  releaseWake(); stopDrone();
  elProg.style.width='0%'; elChrome.classList.remove('show');
  elTimer.classList.remove('show'); elScrim.classList.remove('clear');
  var secs = Math.round(Math.min(el, hardCap));
  var earned = record(secs);
  if(complete) closeTone();

  var nx = nextMile();
  document.getElementById('doneBody').innerHTML =
    '<div class="dbig">'+fmtClock(secs)+'</div>'+
    '<div class="dsub">'+sel.name+(complete?' complete':' — ended early')+'</div>'+
    ringSVG()+
    '<div class="dms">'+fmtLong(store.totalSec)+' total &middot; '+store.streak+' day streak'+
      (nx ? '<br>'+fmtLong(nx.remain)+' to the '+nx.h+'-hour mark'
          : '<br>every milestone reached')+'</div>'+
    (earned ? '<div class="award">'+earned+(earned===1?' hour':' hours')+
              ' — milestone reached</div>' : '')+
    '<div style="height:18px"></div>';
  if(earned) setTimeout(reward, complete?2400:600);
  elSess.classList.add('hide'); elHome.classList.remove('hide');
  renderStats();
  openSheet(elDone);
}

function record(secs){
  if(secs < 20) return 0;
  var before = store.totalSec;
  store.totalSec += secs;
  var d=new Date(), key=d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();
  store.days[key] = (store.days[key]||0) + secs;
  if(store.last !== key){
    var y=new Date(d.getTime()-864e5);
    var yk=y.getFullYear()+'-'+(y.getMonth()+1)+'-'+y.getDate();
    store.streak = (store.last===yk) ? store.streak+1 : 1;
    store.last = key;
  }
  var earned=0;
  for(var i=0;i<MILES.length;i++){
    var need=MILES[i]*3600;
    if(before<need && store.totalSec>=need && store.ms.indexOf(MILES[i])<0){
      store.ms.push(MILES[i]); earned=MILES[i];
    }
  }
  save();
  return earned;
}
function nextMile(){
  for(var i=0;i<MILES.length;i++)
    if(store.totalSec < MILES[i]*3600)
      return {h:MILES[i], remain:MILES[i]*3600-store.totalSec, prev:i?MILES[i-1]*3600:0};
  return null;
}
function ringSVG(){
  var nx=nextMile(), pct=1;
  if(nx){ var span=nx.h*3600-nx.prev; pct=(store.totalSec-nx.prev)/span; }
  var r=54, c=2*Math.PI*r;
  return '<svg class="ring" width="132" height="132" viewBox="0 0 140 140">'+
    '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="rgba(246,239,231,.12)" stroke-width="3"/>'+
    '<circle cx="70" cy="70" r="'+r+'" fill="none" stroke="var(--acc)" stroke-width="3"'+
    ' stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct))+
    '" transform="rotate(-90 70 70)" opacity=".9"/>'+
    '<text x="70" y="66" text-anchor="middle" fill="#f6efe7" font-size="21"'+
    ' font-family="-apple-system,system-ui" font-weight="600">'+(nx?nx.h+'h':'∞')+'</text>'+
    '<text x="70" y="86" text-anchor="middle" fill="rgba(246,239,231,.4)" font-size="10"'+
    ' letter-spacing="1.5">'+Math.round(pct*100)+'%</text></svg>';
}
function fmtLong(s){
  var h=Math.floor(s/3600), m=Math.round((s%3600)/60);
  return h ? h+'h '+m+'m' : m+'m';
}
function renderStats(){
  document.getElementById('stTotal').textContent = fmtLong(store.totalSec)+' practised';
  document.getElementById('stStreak').textContent = store.streak ? store.streak+' day streak' : '';
}

/* ============================ SETTINGS ============================ */
var TIMBRES = [
  {id:'bowls',   n:'Bowls',   d:'warm, long ring'},
  {id:'glass',   n:'Glass',   d:'clear and bright'},
  {id:'handpan', n:'Handpan', d:'round and pitched'},
  {id:'breath',  n:'Breath',  d:'a swell of air'},
  {id:'none',    n:'None',    d:'no phase tone'}
];
var BEDS = [
  {id:'drone',  n:'Thrum',  d:'low sustained bed'},
  {id:'shruti', n:'Shruti', d:'reed harmonium'},
  {id:'rain',   n:'Rain',   d:'soft rainfall'},
  {id:'off',    n:'No bed', d:'tones only'}
];
var VIS_META = [
  {id:'jelly', n:'Drifter', d:'bioluminescent'},
  {id:'aurora',n:'Aurora',  d:'night sky'},
  {id:'ink',   n:'Ink',     d:'bloom in water'},
  {id:'bloom', n:'Bloom',   d:'opening light'}
];

function grid(items, isOn, pick, wideLast){
  var h='<div class="opts">';
  items.forEach(function(o,i){
    var w = (wideLast && items.length%2 && i===items.length-1) ? ' wide' : '';
    h += '<div class="opt'+(isOn(o)?' on':'')+w+'" data-k="'+o.id+'">'+o.n+
         '<small>'+o.d+'</small></div>';
  });
  return h+'</div>';
}

function renderSettings(){
  var B=document.getElementById('setBody');
  var nx=nextMile();
  B.innerHTML =
    '<div class="sh-nm" style="margin-top:0">Settings</div>'+
    '<h4>Companion</h4><div id="gVis"></div>'+
    '<h4>Voice</h4><div id="gTim"></div>'+
    '<h4>Background</h4><div id="gBed"></div>'+
    '<div class="opts" style="margin-top:9px"><div class="opt wide" id="oMetro">Metronome'+
      '<small>soft pulse each second · '+(store.metro?'on':'off')+'</small></div></div>'+
    '<h4>Volume</h4><input type="range" id="vol" min="0" max="100" value="'+
      Math.round(store.vol*100)+'">'+
    '<h4>On opening</h4>'+
    '<div class="opts"><div class="opt wide" id="oResume">'+
      (store.resume?'Pick up where you left off':'Always start on Sleep')+
      '<small>tap to switch</small></div></div>'+
    '<h4>Milestones</h4><div class="badges" id="badges"></div>'+
    '<div class="note">'+(nx ? fmtLong(nx.remain)+' of practice until the '+nx.h+'-hour chime.'
                             : 'All milestones reached.')+'</div>'+
    '<h4>Progress</h4>'+
    '<div class="note">Progress lives on this phone only. Copy this code to carry your '+
      'hours to another phone, or paste one in below and tap Merge.</div>'+
    '<textarea id="expBox" readonly>'+exportCode()+'</textarea>'+
    '<textarea id="impBox" placeholder="paste a code here"></textarea>'+
    '<div class="opts" style="margin-top:9px"><div class="opt wide" id="oMerge">Merge code</div></div>'+
    '<div class="danger" id="oReset">Reset all progress</div>'+
    '<div class="note">Add to Home Screen from Safari&rsquo;s share menu to run full screen '+
      'and offline. Keep the app open during a session — iOS stops web audio when you switch '+
      'away. This is a calming practice, not medical treatment. If you feel dizzy, stop and '+
      'breathe normally.</div><div style="height:14px"></div>';

  document.getElementById('gVis').innerHTML =
    grid(VIS_META, function(o){return store.vis===o.id;});
  document.getElementById('gTim').innerHTML =
    grid(TIMBRES, function(o){return store.timbre===o.id;}, null, true);
  document.getElementById('gBed').innerHTML =
    grid(BEDS, function(o){return store.bed===o.id;});

  document.getElementById('gVis').onclick=function(e){
    var o=e.target.closest('.opt'); if(!o) return;
    store.vis=o.dataset.k; if(store.vis==='jelly') ropeInit(); save(); renderSettings();
    if(cat!=='all') paintWorld();
  };
  document.getElementById('gTim').onclick=function(e){
    var o=e.target.closest('.opt'); if(!o) return;
    store.timbre=o.dataset.k; save(); renderSettings(); if(cat!=='all') paintWorld();
    if(store.timbre!=='none'){ initAudio(); cue('in',4); }
  };
  document.getElementById('gBed').onclick=function(e){
    var o=e.target.closest('.opt'); if(!o) return;
    store.bed=o.dataset.k; save(); renderSettings(); stopDrone();
    if(store.bed!=='off'){ initAudio();
      setTimeout(function(){ startDrone(); if(!running) setTimeout(stopDrone,5000); },60); }
  };
  document.getElementById('oMetro').onclick=function(){
    store.metro=!store.metro; save(); renderSettings();
    if(store.metro){ initAudio(); tick(); }
  };
  document.getElementById('oResume').onclick=function(){
    store.resume=!store.resume; save(); renderSettings();
  };
  document.getElementById('vol').oninput=function(){
    store.vol=this.value/100; save();
    if(master) master.gain.setTargetAtTime(store.vol, A.currentTime, .05);
  };
  var bd=document.getElementById('badges');
  MILES.forEach(function(h){
    var d=document.createElement('div');
    d.className='badge'+(store.totalSec>=h*3600?' got':'');
    d.textContent=h+'h'; bd.appendChild(d);
  });
  document.getElementById('expBox').onclick=function(){ this.select(); };
  document.getElementById('oMerge').onclick=function(){
    var ok=importCode(document.getElementById('impBox').value);
    this.textContent = ok ? 'Merged' : 'That code did not read';
    if(ok){ renderStats(); setTimeout(renderSettings, 900); }
  };
  document.getElementById('oReset').onclick=function(){
    store.totalSec=0; store.days={}; store.streak=0; store.last=''; store.ms=[];
    save(); renderStats(); renderSettings();
  };
}
document.getElementById('cogBtn').onclick=function(){ renderSettings(); openSheet(elSet); };

/* ============================ BOOT ============================ */
resize();
ropeInit();
applyCat();
renderStats();
requestAnimationFrame(frame);
['touchstart','mousedown'].forEach(function(ev){
  window.addEventListener(ev, function once(){
    initAudio(); unlockSilent();
    window.removeEventListener(ev, once);
  }, {passive:true});
});

})();
</script>

</body>
</html>
